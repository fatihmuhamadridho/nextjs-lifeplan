<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2864e8" />
    <title>You're offline | LifePlan</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        background: #f7f9fc;
        color: #14213a;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 420px);
        padding: 36px;
        border: 1px solid #e3eaf4;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 18px 50px #14213a12;
        text-align: center;
        box-sizing: border-box;
      }

      img {
        width: 72px;
        height: 72px;
      }

      h1 {
        margin: 20px 0 10px;
        font-size: 28px;
      }

      p {
        color: #64748b;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        margin-top: 12px;
        padding: 12px 20px;
        border-radius: 10px;
        background: #2864e8;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/lifeplan-192.png" alt="" width="72" height="72" />
      <h1>You're offline</h1>
      <p>Connect to the internet, then try again to continue planning your goals.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
